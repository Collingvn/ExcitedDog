<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excited Dog</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f8a3a; font-family: "Trebuchet MS", "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) 22px 14px; font-size: 28px; font-weight: 800; color: #fffbe8; text-shadow: 0 2px 0 rgba(60, 40, 0, .5); pointer-events: none; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(35, 60, 30, .6); color: #fffbe8; text-align: center; padding: 20px; }
  #msg.hidden { display: none; }
  #msg h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); }
  #msg p { margin: 0; font-size: clamp(16px, 2.6vw, 22px); max-width: 520px; }
  #go { margin-top: 12px; font: inherit; font-size: 24px; font-weight: 800; padding: 12px 34px; border: 0; border-radius: 40px; background: #f5b800; color: #4a2c00; cursor: pointer; }
  #go:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="hud"><span id="score">Bones: 0</span><span id="time">Time: 60</span></div>
<div id="msg">
  <h1 id="title">Excited Dog</h1>
  <p id="sub">Collect golden bones. Don't get too close to the sleeping cat. Move with the mouse, arrow keys, or a tap.</p>
  <button id="go">Play</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const FW = 20, FH = 12, HX = FW / 2 - 0.6, HZ = FH / 2 - 0.6;
  const WAKE = 2.2, PICK = 0.65, ROUND = 60, SPEED = 7, BONES = 4;
  const CAT_POS = new THREE.Vector3(4, 0, -0.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x3f8a3a);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  camera.position.set(0, 20, 12);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(-6, 12, 8);
  scene.add(sun);

  function fit() {
    const w = innerWidth, h = innerHeight, aspect = w / h;
    const halfH = Math.max(7.2, 11 / aspect), halfW = halfH * aspect;
    camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  addEventListener('resize', fit); fit();

  const field = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), new THREE.MeshLambertMaterial({ color: 0x7ccf5a }));
  field.rotation.x = -Math.PI / 2;
  scene.add(field);

  const mat = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));
  function ball(r, c, x, y, z, sx, sy, sz) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat(c));
    m.position.set(x, y, z); m.scale.set(sx || 1, sy || 1, sz || 1); return m;
  }

  // ---- Dog ----
  const dog = new THREE.Group();
  const dogBody = new THREE.Group();
  dog.add(dogBody);
  dogBody.add(ball(0.45, 0xd9923a, 0, 0.55, 0, 1, 0.85, 1.5));
  dogBody.add(ball(0.32, 0xd9923a, 0, 0.9, 0.7));
  dogBody.add(ball(0.16, 0xf3d9a8, 0, 0.82, 1.0, 1, 0.8, 1.2));
  dogBody.add(ball(0.06, 0x222222, 0, 0.88, 1.15));
  dogBody.add(ball(0.05, 0x222222, -0.13, 0.98, 0.95));
  dogBody.add(ball(0.05, 0x222222, 0.13, 0.98, 0.95));
  [-1, 1].forEach(s => {
    const ear = ball(0.13, 0x7a4a1c, s * 0.27, 1.0, 0.6, 0.6, 1.3, 0.8);
    ear.rotation.z = s * 0.4; dogBody.add(ear);
    [0.4, -0.4].forEach(z => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), mat(0xc07f2c));
      leg.position.set(s * 0.22, 0.2, z); dogBody.add(leg);
    });
  });
  const tail = new THREE.Group();
  tail.position.set(0, 0.7, -0.7);
  const tailMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.5, 8), mat(0xc07f2c));
  tailMesh.position.y = 0.25; tail.add(tailMesh); tail.rotation.x = -0.6;
  dogBody.add(tail);
  scene.add(dog);

  // ---- Cat ----
  const cat = new THREE.Group();
  const catBody = new THREE.Group();
  cat.add(catBody);
  catBody.add(ball(0.5, 0x8c8ca0, 0, 0.35, 0, 1, 0.7, 1.4));
  catBody.add(ball(0.3, 0x8c8ca0, 0, 0.4, 0.75));
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.25, 4), mat(0x6e6e84));
    ear.position.set(s * 0.17, 0.72, 0.75); catBody.add(ear);
  });
  const tailC = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.9, 8), mat(0x6e6e84));
  tailC.rotation.x = Math.PI / 2; tailC.position.set(0.25, 0.3, -0.9);
  catBody.add(tailC);
  const eyes = new THREE.Group();
  [-1, 1].forEach(s => eyes.add(ball(0.06, 0xffe600, s * 0.12, 0.5, 1.0)));
  eyes.visible = false; catBody.add(eyes);
  scene.add(cat);

  // ---- Bones ----
  const boneMat = new THREE.MeshStandardMaterial({ color: 0xffc400, metalness: 0.6, roughness: 0.3, emissive: 0x553a00 });
  function makeBone() {
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.7, 10), boneMat);
    shaft.rotation.z = Math.PI / 2; g.add(shaft);
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(p => {
      const k = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), boneMat);
      k.position.set(p[0] * 0.38, 0, p[1] * 0.1); g.add(k);
    });
    g.position.y = 0.5; scene.add(g); return g;
  }
  const bones = [];
  for (let i = 0; i < BONES; i++) bones.push(makeBone());

  // ---- State ----
  let state = 'ready', score = 0, timeLeft = ROUND, chaseT = 0, target = null, last = performance.now();
  const keys = new Set();
  const $ = id => document.getElementById(id);

  function placeBone(i) {
    for (let tries = 0; tries < 80; tries++) {
      let x, z;
      if (i === 0) { // always one bone just outside the cat's wake zone
        const a = Math.random() * Math.PI * 2, r = WAKE + 0.5 + Math.random() * 0.6;
        x = CAT_POS.x + Math.cos(a) * r; z = CAT_POS.z + Math.sin(a) * r;
      } else {
        x = (Math.random() * 2 - 1) * HX; z = (Math.random() * 2 - 1) * HZ;
      }
      if (Math.abs(x) > HX || Math.abs(z) > HZ) continue;
      if (Math.hypot(x - CAT_POS.x, z - CAT_POS.z) < WAKE + 0.4) continue;
      if (Math.hypot(x - dog.position.x, z - dog.position.z) < 2) continue;
      if (bones.some((b, j) => j !== i && b.visible && Math.hypot(x - b.position.x, z - b.position.z) < 1.5)) continue;
      bones[i].position.set(x, 0.5, z); bones[i].visible = true; return;
    }
    bones[i].position.set(-HX + 1, 0.5, -HZ + 1); bones[i].visible = true;
  }

  // Every 15 bones the sleeping cat moves to a new spot, away from the dog
  function moveCat() {
    for (let tries = 0; tries < 80; tries++) {
      const x = (Math.random() * 2 - 1) * 7, z = (Math.random() * 2 - 1) * 3.5;
      if (Math.hypot(x - dog.position.x, z - dog.position.z) < WAKE + 2.5) continue;
      if (Math.hypot(x - CAT_POS.x, z - CAT_POS.z) < 4) continue;
      CAT_POS.set(x, 0, z);
      cat.position.copy(CAT_POS);
      cat.rotation.y = Math.random() * Math.PI * 2;
      bones.forEach((b, i) => {
        if (i === 0 || Math.hypot(b.position.x - x, b.position.z - z) < WAKE + 0.4) placeBone(i);
      });
      return;
    }
  }

  function reset() {
    score = 0; timeLeft = ROUND; chaseT = 0; target = null;
    dog.position.set(-6, 0, 1); dog.rotation.y = Math.PI / 2;
    CAT_POS.set(4, 0, -0.5);
    cat.position.copy(CAT_POS); cat.rotation.y = Math.PI * 0.9;
    catBody.scale.set(1, 1, 1); catBody.position.y = 0; eyes.visible = false;
    bones.forEach((b, i) => { b.visible = false; });
    bones.forEach((b, i) => placeBone(i));
    $('score').textContent = 'Bones: 0'; $('time').textContent = 'Time: ' + ROUND;
  }

  function endGame(reason) {
    state = 'over';
    $('title').textContent = 'Game over';
    $('sub').innerHTML = reason + '<br><b>Bones collected: ' + score + '</b>';
    $('go').textContent = 'Play again';
    $('msg').classList.remove('hidden');
  }

  function start() { reset(); state = 'play'; $('msg').classList.add('hidden'); }
  $('go').addEventListener('click', start);
  $('go').addEventListener('pointerdown', e => e.stopPropagation());

  // ---- Input ----
  const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  function aim(e) {
    ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
    if (ray.ray.intersectPlane(plane, hit)) {
      target = { x: Math.max(-HX, Math.min(HX, hit.x)), z: Math.max(-HZ, Math.min(HZ, hit.z)) };
    }
  }
  renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') aim(e); });
  renderer.domElement.addEventListener('pointerdown', aim);
  addEventListener('keydown', e => {
    if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); }
  });
  addEventListener('keyup', e => keys.delete(e.key));

  // ---- Loop ----
  function moveDog(dt) {
    let dx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
    let dz = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
    let step = SPEED * dt;
    if (dx || dz) {
      target = null; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
    } else if (target) {
      const tx = target.x - dog.position.x, tz = target.z - dog.position.z, d = Math.hypot(tx, tz);
      if (d > 0.12) { dx = tx / d; dz = tz / d; step = Math.min(step, d); } else { step = 0; }
    } else { step = 0; }
    if (step > 0) {
      dog.position.x = Math.max(-HX, Math.min(HX, dog.position.x + dx * step));
      dog.position.z = Math.max(-HZ, Math.min(HZ, dog.position.z + dz * step));
      dog.rotation.y = Math.atan2(dx, dz);
    }
    return step > 0;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const t = now / 1000;

    // idle animations
    tail.rotation.z = Math.sin(t * 22) * 0.7;
    bones.forEach((b, i) => { b.rotation.y = t * 2 + i; b.position.y = 0.5 + Math.sin(t * 3 + i) * 0.08; });
    if (state !== 'chase') catBody.scale.y = 1 + Math.sin(t * 2) * 0.04;

    if (state === 'play') {
      const moving = moveDog(dt);
      dogBody.position.y = moving ? Math.abs(Math.sin(t * 16)) * 0.15 : Math.abs(Math.sin(t * 8)) * 0.05;

      bones.forEach((b, i) => {
        if (b.visible && Math.hypot(b.position.x - dog.position.x, b.position.z - dog.position.z) < PICK) {
          score++; $('score').textContent = 'Bones: ' + score; placeBone(i);
          if (score % 15 === 0) moveCat();
        }
      });

      timeLeft -= dt;
      $('time').textContent = 'Time: ' + Math.max(0, Math.ceil(timeLeft));

      if (Math.hypot(dog.position.x - cat.position.x, dog.position.z - cat.position.z) < WAKE) {
        state = 'chase'; chaseT = 0;
        eyes.visible = true; catBody.scale.set(1, 1.5, 1);
      } else if (timeLeft <= 0) {
        endGame("Time's up!");
      }
    } else if (state === 'chase') {
      chaseT += dt;
      const dx = dog.position.x - cat.position.x, dz = dog.position.z - cat.position.z, d = Math.hypot(dx, dz);
      cat.rotation.y = Math.atan2(dx, dz);
      if (d > 0.5) { cat.position.x += dx / d * 9 * dt; cat.position.z += dz / d * 9 * dt; }
      catBody.position.y = Math.abs(Math.sin(t * 18)) * 0.2;
      if (chaseT > 1) endGame('The cat woke up and is chasing you!');
    }

    renderer.render(scene, camera);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
